<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha | Chamados de TI</title>
    <link rel="stylesheet" href="styles.css?v=20261020" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Painel de TI</p>
        <h1>Redefinicao de senha</h1>
      </div>
    </header>

    <main class="admin-shell">
      <section class="login-shell">
        <article class="panel login-panel">
          <p class="eyebrow">Acesso seguro</p>
          <h2>Crie uma nova senha</h2>
          <p id="resetDescription" class="hero-copy">
            Escolha uma senha nova para voltar a acessar o sistema.
          </p>

          <form id="resetPasswordForm" class="login-form" hidden>
            <label>
              Nova senha
              <input
                name="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Use pelo menos 8 caracteres"
                required
              />
            </label>

            <label>
              Confirmar nova senha
              <input
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Repita a nova senha"
                required
              />
            </label>

            <button class="primary-button" type="submit">Salvar nova senha</button>
          </form>

          <p id="resetMessage" class="hint-message">Validando o link...</p>
        </article>
      </section>
    </main>

    <script src="reset-password.js?v=20261020"></script>
  </body>
</html>
